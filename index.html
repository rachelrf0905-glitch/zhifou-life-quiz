<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#efe4cc"><title>知否人生局｜浮生命书</title>
<style>
:root{--ink:#282c25;--jade:#31483d;--jade2:#496252;--gold:#a7834e;--paper:#f8f1e3;--line:#cbb98f;--red:#914d40}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Songti SC","Noto Serif CJK SC",serif;background:radial-gradient(ellipse at 50% 10%,#fff9ed,#d9c9a9 80%)}button,input{font:inherit}.frame{max-width:760px;min-height:100vh;margin:auto;padding:24px 18px 50px}.paper{min-height:calc(100vh - 74px);padding:clamp(24px,6vw,58px);background:linear-gradient(135deg,#fbf6e9,#f4ead6);border:1px solid #b49b6e;outline:5px double #cdbb93;outline-offset:-10px;box-shadow:0 18px 60px #42351e30;position:relative}.paper:before,.paper:after{content:"❖";position:absolute;color:var(--gold);font-size:20px;top:18px}.paper:before{left:20px}.paper:after{right:20px}.seal{margin:auto;border:1px solid var(--red);color:var(--red);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;line-height:1.1;font-size:13px;text-align:center}.eyebrow{text-align:center;color:var(--gold);letter-spacing:.5em;font-size:12px;margin:18px 0}.title{text-align:center;font-size:clamp(30px,7vw,48px);letter-spacing:.22em;margin:14px 0;color:#293b30}.rule{width:110px;border:0;border-top:1px solid var(--gold);margin:22px auto}.intro-art{height:220px;max-width:440px;margin:24px auto;border:5px solid #e6d8bb;background:linear-gradient(#233b2d25,#233b2d70),url('art.png') center/cover;border-radius:180px 180px 5px 5px}.copy{text-align:center;line-height:2;color:#5d5a4e}.gate{max-width:360px;margin:28px auto 0}.gate label{display:block;text-align:center;letter-spacing:.3em;color:var(--gold);margin-bottom:10px}.gate input{width:100%;padding:14px;text-align:center;letter-spacing:.5em;background:#fffaf0;border:1px solid var(--line);outline:none}.btn{display:block;width:100%;margin:16px auto 0;padding:14px;border:1px solid #253d32;background:var(--jade);color:#fff7e7;letter-spacing:.25em;cursor:pointer}.btn:hover{background:var(--jade2)}.error{text-align:center;color:var(--red);min-height:1.5em}.small{text-align:center;color:#897d68;font-size:12px;line-height:1.8;margin-top:20px}.topline{display:flex;justify-content:space-between;color:var(--gold);font-size:12px;letter-spacing:.15em}.progress{height:3px;background:#dfd2b7;margin:14px 0 34px}.progress i{display:block;height:100%;background:var(--jade);transition:width .25s}.chapter{text-align:center;color:var(--gold);letter-spacing:.35em;font-size:12px}.question{text-align:center;font-size:clamp(21px,5vw,28px);line-height:1.7;margin:22px 0 8px}.scene{text-align:center;color:#736c5e;line-height:1.9;margin:0 auto 25px;max-width:520px}.choices{display:grid;gap:12px}.choice{background:#fffaf0;border:1px solid #d7c7a6;color:#37372f;text-align:left;padding:15px 17px;line-height:1.7;cursor:pointer}.choice:hover,.choice:focus{border-color:var(--gold);background:#f2e7d1}.choice b{color:var(--red);margin-right:8px}.back{background:none;border:0;color:#81745e;cursor:pointer;margin-top:18px;padding:8px}.result-head{text-align:center}.result-art{width:min(280px,80%);height:220px;margin:20px auto;background:linear-gradient(#1c302b10,#1c302b70),url('art.png') center/cover;border:5px solid #e3d4b4;border-radius:150px 150px 3px 3px}.person{text-align:center;color:var(--jade);font-size:32px;letter-spacing:.18em;margin:8px}.motto{text-align:center;color:var(--gold);letter-spacing:.2em}.section{margin-top:26px;padding:18px 20px;background:#fffaf0a8;border-left:2px solid var(--gold)}.section h3{margin:0 0 8px;color:var(--jade);letter-spacing:.15em;font-size:16px}.section p{margin:0;line-height:2;color:#59564c}.pill{display:inline-block;border:1px solid var(--line);padding:5px 10px;margin:4px;color:#74613f;font-size:12px}.hide{display:none}
</style></head>
<body><main class="frame"><article class="paper" id="app"></article></main>
<script>
const code="310941";
const questions=[
["初入盛家","席间有人言语试探，你会如何应对？",["暂且不争，先听清各方心意","坦率回应，不把委屈藏心里","记下话中关窍，寻机扭转局面","当面立下分寸，不任人拿捏"],[0,1,2,3]],
["家宴风波","一场家宴上，长辈偏心引来难堪。",["顾全大局，私下再劝解","替受委屈的人说句公道话","顺势观察谁在借题发挥","不愿忍气吞声，直言不平"],[0,1,2,3]],
["择亲之议","婚事由长辈提起，你最看重什么？",["人品可靠，日子安稳","两心相悦，彼此真诚","家世与前程都要细细权衡","自己是否愿意，不能任人安排"],[4,1,2,3]],
["姐妹相争","姐妹误会渐深，你会怎样做？",["等情绪平复后慢慢解释","先表明心意，不让误会过夜","找出误会源头，再逐一化解","把底线说清，不接受无端指责"],[0,1,2,3]],
["流言四起","关于你的流言传遍府中。",["留存证据，待合适时机澄清","立刻找当事人说清楚","追查是谁散布，掌握主动","当众说明立场，不躲不退"],[0,1,2,3]],
["家中变故","家中突生变故，众人各有主张。",["先稳住局面，安排轻重缓急","照应身边人的情绪与需要","盘点资源，找出可行的破局处","主动承担，不等别人替你决定"],[0,5,2,3]],
["心愿难全","眼前机会难得，却可能令亲近之人失望。",["权衡长远，再作不悔选择","先与对方坦诚商量","争取两全之策，预备后路","愿为心愿负责，承担选择代价"],[4,1,2,3]],
["掌家之责","若由你主持家中事务，最先做什么？",["立清楚规矩，让事情有序","让家人都能被倾听与照顾","查清账目与人情往来","整顿积弊，赏罚分明"],[0,5,6,7]],
["人情往来","有人向你求助，但此事牵连复杂。",["先辨明实情，再决定如何帮","愿意帮忙，也会说明自己的难处","判断利害关系，找稳妥办法","该拒绝时就拒绝，不被情面裹挟"],[0,1,2,3]],
["回望此生","多年后回望，你最希望自己没有辜负什么？",["初心与清醒","真心相待的人","自己争取过的前程","独立选择人生的勇气"],[0,5,6,7]]
];
const people=[
{n:"盛明兰",m:"静水流深，心有丘壑",traits:["沉着敏锐","善于观察","外柔内韧"],style:"你习惯先看清局势，再稳稳落子。遇到纷争，不急着争一时高下，而重在守住长远与重要之人。",advice:"别总把坚强放在第一位。适时表达需要、信任值得信任的人，也是一种谋略。"},
{n:"盛如兰",m:"赤诚如初，自有春光",traits:["真诚热烈","爱憎分明","珍惜情义"],style:"你愿意坦率表达，不喜欢把人生过成旁人的安排。你以真心待人，也期待关系里有回应。",advice:"直率是可贵的底色；遇到重要选择，给自己一点冷静时间，让热忱与判断同行。"},
{n:"盛墨兰",m:"心有高枝，步步争先",traits:["目标清晰","敏于机会","进取心强"],style:"你看得到阶梯，也愿意为理想争取位置。复杂局面中，你能迅速感知评价、资源与机会的流向。",advice:"把目光从他人的认可稍稍收回，确认目标是否真正属于自己，才能走得更自在。"},
{n:"顾廷烨",m:"逆风执剑，敢破旧局",traits:["独立果敢","行动力强","重诺护人"],style:"你不甘受困于旧规，遇到难题倾向主动破局。认定重要的人与事，便愿承担实际责任。",advice:"勇敢之外，也给身边人选择和表达的空间；真正的担当包含倾听。"},
{n:"齐衡",m:"一片丹心，守望如初",traits:["温润善意","珍视承诺","内心有原则"],style:"你重情守信，愿意在现实与理想间寻找不伤人的办法。你不爱强求，却会认真对待每一份真心。",advice:"体谅别人时，也别忘了替自己的愿望留一个位置；迟疑太久，机会可能悄然过去。"},
{n:"盛老太太",m:"阅尽千帆，护心中人",traits:["通透稳重","洞察人情","善于布局"],style:"你见事清醒，擅长从复杂关系中辨明轻重。面对风波，你更愿意沉住气，为长久安稳安排路径。",advice:"照拂众人之余，记得给自己留出休息与快乐，不必每件事都由你操心。"},
{n:"盛长柏",m:"持正守礼，行稳致远",traits:["重视责任","讲求原则","稳健可靠"],style:"你看重秩序与承诺，倾向用清楚的规则解决问题。面对压力，你能坚持长期目标，不轻易偏离底线。",advice:"规则之外也有人的难处；适度灵活，会让你的坚持更有温度。"},
{n:"张大娘子",m:"傲骨不折，直面风雨",traits:["自尊独立","敢于担当","不惧冲突"],style:"你珍视尊严与自主，遇到不公不愿退让。你能在压力中站稳立场，也愿意为自己的决定负责。",advice:"坚守底线时不必独自硬扛，接受可靠的支持并不意味着示弱。"}
];
let app=document.getElementById("app"),page=-1,answers=[],verified=false;
function intro(){app.innerHTML='<div class="seal">知<br>否</div><div class="eyebrow">一卷人生 · 十番抉择</div><h1 class="title">知否人生局</h1><hr class="rule"><div class="intro-art" role="img" aria-label="古风庭院"></div><p class="copy">若生于盛家深宅，面对亲情、情义与命运<br>你会如何落子？<br>十道抉择之后，照见你的处世之道。</p><div class="gate"><label for="code">入 局 凭 信</label><input id="code" inputmode="numeric" maxlength="6" placeholder="请输入六位验证码"><div class="error" id="err"></div><button class="btn" onclick="start()">验信 · 开卷</button></div><p class="small">验证码 310941 · 测试结果仅供娱乐与自我观察</p>'}
function start(){if(document.getElementById("code").value.trim()!==code){document.getElementById("err").textContent="验证码不符，请核对后再试。";return}verified=true;page=0;draw()}
function draw(){const q=questions[page];app.innerHTML='<div class="topline"><span>浮生命书</span><span>第 '+(page+1)+' / 10 题</span></div><div class="progress"><i style="width:'+((page+1)*10)+'%"></i></div><div class="chapter">盛家纪事 · '+["初入府门","家宅风波","心意与抉择","命运落子"][Math.min(3,Math.floor(page/3))]+'</div><h2 class="question">'+q[0]+'</h2><p class="scene">'+q[1]+'</p><div class="choices">'+q[2].map((x,i)=>'<button class="choice" onclick="answer('+i+')"><b>'+["甲","乙","丙","丁"][i]+' ·</b>'+x+'</button>').join("")+'</div>'+(page?'<button class="back" onclick="page--;draw()">← 返回上一题</button>':"")}
function answer(i){answers[page]=i;if(page<9){page++;draw()}else result()}
function result(){const score=Array(8).fill(0);answers.forEach((a,q)=>score[questions[q][3][a]]++);let best=Math.max(...score),winners=score.map((x,i)=>x===best?i:-1).filter(i=>i>=0);let p=people[winners[(answers.reduce((s,x)=>s+x,0))%winners.length]];app.innerHTML='<div class="result-head"><div class="seal">命<br>书</div><div class="eyebrow">十番抉择 · 浮生有答</div><div class="result-art"></div><div class="person">'+p.n+'</div><div class="motto">'+p.m+'</div></div><section class="section"><h3>性情特点</h3><p>'+p.traits.map(t=>'<span class="pill">'+t+'</span>').join("")+'</p></section><section class="section"><h3>处事风格</h3><p>'+p.style+'</p></section><section class="section"><h3>给你的行事建议</h3><p>'+p.advice+'</p></section><p class="small">此为基于本次选择生成的娱乐性画像，不定义你的一生。</p><button class="btn" onclick="restart()">再入一局</button>'}
function restart(){page=-1;answers=[];verified=false;intro()}
intro();
</script></body></html>
