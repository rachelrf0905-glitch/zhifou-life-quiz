function calculate(){let sums=Array(8).fill(0);answers.forEach((a,q)=>{let v=vectors[a].map((x,k)=>{let shift=(((q*7+k*3)%5)-2)*7;return Math.max(0,Math.min(100,x+shift))});v.forEach((x,k)=>sums[k]+=x)});let scores=sums.map(x=>x/answers.length);let ranked=people.map(p=>({p,dist:p[1].reduce((s,x,i)=>s+Math.pow((x-scores[i])/100,2)*([1,1,1.2,1,1,1,1,1.2][i]),0)})).sort((a,b)=>a.dist-b.dist);let main=ranked[0].p,secondary=ranked.find(x=>x.p!==main).p;let sorted=scores.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v);let labels=['谋定后动','热烈真诚','独立自主','志在高处','珍惜情义','敢于冒险','坚守底线','善于掌局'];let ally=people.filter(x=>x!==main).sort((a,b)=>a[1].reduce((s,v,i)=>s+Math.abs(v-main[1][i]),0)-b[1].reduce((s,v,i)=>s+Math.abs(v-main[1][i]),0))[0];let rival=people.filter(x=>x!==main).sort((a,b)=>b[1].reduce((s,v,i)=>s+Math.abs(v-main[1][i]),0)-a[1].reduce((s,v,i)=>s+Math.abs(v-main[1][i]),0))[0];return {main,secondary,ally,rival,scores,tags:sorted.slice(0,3).map(x=>labels[x.i]),ending:scores[2]>60?'你终究学会了自己执笔，纵使风雨未歇，也能把日子经营成心中模样。':'你在世事浮沉中寻得自己的节奏，不必事事争先，也能守住珍贵的安宁。'}}
